version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      fonts:
        patterns:
          - "@fontsource*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
